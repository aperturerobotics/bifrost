name: Prune superseded Go dependency caches
description: >-
  Delete this job's trusted Go dependency cache entries keyed by an older
  go.sum hash. They are never restored again and only fill the repository
  cache quota. Concurrent jobs may delete the same entry, so an entry that
  is already gone is skipped. Requires the actions write permission.

runs:
  using: composite
  steps:
    - shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        CACHE_PREFIX: trusted-go-${{ github.job }}-${{ runner.os }}-go-
        CACHE_KEY: trusted-go-${{ github.job }}-${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
      run: |
        set -euo pipefail
        gh cache list --repo "${GITHUB_REPOSITORY}" --key "${CACHE_PREFIX}" --limit 100 \
          --json id,key --jq '.[] | select(.key != env.CACHE_KEY) | .id' |
          while read -r id; do
            if ! out="$(gh cache delete "${id}" --repo "${GITHUB_REPOSITORY}" 2>&1)"; then
              case "${out}" in
                *"Could not find a cache"*) ;;
                *) echo "${out}" >&2; exit 1 ;;
              esac
            fi
          done
