syntax = "proto3";
package spacewave.chat.rpc;

import "google/protobuf/timestamp.proto";
import "github.com/s4wave/spacewave/sdk/chat/content/content.proto";
import "github.com/s4wave/spacewave/sdk/chat/state/state.proto";

option go_package = "github.com/s4wave/spacewave/sdk/chat/rpc;spacewave_chat_rpc";

// ChatResourceService serves authorized operations for one chat channel.
service ChatResourceService {
  // GetChannelInfo returns channel metadata and its retained history extent.
  rpc GetChannelInfo(GetChannelInfoRequest) returns (GetChannelInfoResponse);
  // GetMessage returns one message from this channel by object key.
  rpc GetMessage(GetMessageRequest) returns (GetMessageResponse);
  // ListMessages returns a bounded page of channel history.
  rpc ListMessages(ListMessagesRequest) returns (ListMessagesResponse);
  // WatchMessages streams channel messages after each shared-state change.
  rpc WatchMessages(WatchMessagesRequest) returns (stream WatchMessagesResponse);
  // SendMessage appends one message or resolves an identical retry.
  rpc SendMessage(SendMessageRequest) returns (SendMessageResponse);
  // GetReadPositions returns the channel's shared per-person read positions.
  rpc GetReadPositions(GetReadPositionsRequest) returns (GetReadPositionsResponse);
  // UpdateReadPosition advances only the authenticated person's read position.
  rpc UpdateReadPosition(UpdateReadPositionRequest) returns (UpdateReadPositionResponse);
}

// ChatMessageInfo contains flattened message info for the client.
message ChatMessageInfo {
  // ObjectKey is the message world object key.
  string object_key = 1;
  // SenderPeerId is the sender's peer ID.
  string sender_peer_id = 2;
  // Text is the message text content. Empty for ciphertext messages.
  string text = 3;
  // CreatedAt is the message creation timestamp.
  .google.protobuf.Timestamp created_at = 4;
  // ReplyToKey is the key of the message being replied to.
  string reply_to_key = 5;
  // Index is the immutable zero-based position in the channel history.
  uint64 index = 6;
  // Content is the full typed message content, including ciphertext envelopes.
  .spacewave.chat.ChatMessageContent content = 7;
  // PersonPeerId is the verified person identity associated with the sending device.
  string person_peer_id = 8;
}

// GetChannelInfoRequest is a request for channel info.
message GetChannelInfoRequest {
}

// GetChannelInfoResponse contains channel metadata.
message GetChannelInfoResponse {
  // Name is the channel name.
  string name = 1;
  // Topic is the channel topic.
  string topic = 2;
  // MessageCount is the number of messages retained in channel history.
  uint64 message_count = 3;
  // CreatedAt is the channel creation timestamp.
  .google.protobuf.Timestamp created_at = 4;
}

// GetMessageRequest identifies one channel message to read.
message GetMessageRequest {
  // MessageKey is the channel-scoped object key to read.
  string message_key = 1;
}

// GetMessageResponse contains the selected channel message.
message GetMessageResponse {
  // Message is the selected message projection.
  ChatMessageInfo message = 1;
}

// ListMessagesRequest is a request for paginated messages.
message ListMessagesRequest {
  // BeforeKey returns messages before this key (for pagination).
  string before_key = 1;
  // Limit is the maximum number of messages to return.
  uint32 limit = 2;
  // BeforeIndex selects an exclusive upper bound for backwards pagination.
  optional uint64 before_index = 3;
  // FromIndex selects an inclusive lower bound for forwards pagination.
  optional uint64 from_index = 4;
}

// ListMessagesResponse contains a page of messages.
message ListMessagesResponse {
  // Messages is the list of messages.
  repeated ChatMessageInfo messages = 1;
  // HasMore indicates more messages exist in the selected pagination direction.
  bool has_more = 2;
}

// WatchMessagesRequest is a request to stream messages.
message WatchMessagesRequest {
}

// WatchMessagesResponse contains a batch of new messages.
message WatchMessagesResponse {
  // Messages is the list of new messages since last response.
  repeated ChatMessageInfo messages = 1;
}

// SendMessageRequest is a request to send a message.
message SendMessageRequest {
  // Text is the message text.
  string text = 1;
  // ReplyToKey is the optional key of the message to reply to.
  string reply_to_key = 2;
  // TransactionId identifies a retryable send within the authenticated sender
  // and channel. Reuse with different content is rejected; empty always appends.
  string transaction_id = 3;
  // Content is the typed message content. When set, it is persisted as given
  // and the legacy text field is rejected if also supplied.
  .spacewave.chat.ChatMessageContent content = 4;
}

// SendMessageResponse is the response after sending a message.
message SendMessageResponse {
  // MessageKey is the object key of the created message.
  string message_key = 1;
}

// GetReadPositionsRequest selects shared receipt state for the mounted channel.
message GetReadPositionsRequest {
}

// GetReadPositionsResponse reports the canonical read positions for this channel.
message GetReadPositionsResponse {
  // Positions maps external person peer identities to their monotonic read positions.
  map<string, .spacewave.chat.ChatReadPosition> positions = 1;
}

// UpdateReadPositionRequest advances the person already authenticated by the host.
message UpdateReadPositionRequest {
  // NextIndex is the first unread index, bounded by the channel's message count.
  uint64 next_index = 1;
}

// UpdateReadPositionResponse reports the retained position, including unchanged retries.
message UpdateReadPositionResponse {
  // Position is the authenticated person's current shared read position.
  .spacewave.chat.ChatReadPosition position = 1;
}
