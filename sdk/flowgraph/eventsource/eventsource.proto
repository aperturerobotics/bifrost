syntax = "proto3";
package s4wave.flowgraph.eventsource;

option go_package = "github.com/s4wave/spacewave/sdk/flowgraph/eventsource;flowgraph_eventsource";

// EventSourceService is served by the per-object resource of an object type
// that is an event source. The run controller of a Flowgraph's standing run
// calls it for each event-source node bound to such an object.
service EventSourceService {
  // WatchEvents streams the events the source holds after the cursor. It
  // sends the events already waiting as the first batch, then each batch as
  // events arrive, until the caller cancels the stream. The source may repeat
  // an event after a restart: the run applies a delivery only against its
  // stored cursor, so a repeat changes nothing.
  rpc WatchEvents(WatchEventsRequest) returns (stream WatchEventsResponse);
}

// SourceEvent is one event of an event source.
message SourceEvent {
  // EventId identifies the event within its source.
  string event_id = 1;
  // Key is the key the source derives for the arrival, which selects a keyed
  // Step activation. It is empty for an ordinary event, and for the Fixer
  // intake it is a Topic.
  string key = 2;
  // PayloadObjectKey is the World object that carries the event's data. It is
  // empty when the event has no payload, and the arrival then names the source
  // object itself.
  string payload_object_key = 3;
}

// WatchEventsRequest opens a stream of events.
message WatchEventsRequest {
  // Cursor is the position after which the stream resumes: the cursor the run
  // stored for the node, or empty to start from the beginning.
  bytes cursor = 1;
}

// WatchEventsResponse is one batch of events.
message WatchEventsResponse {
  // Events are the events of the batch, in order.
  repeated SourceEvent events = 1;
  // NextCursor is the position after the last event of the batch. A batch with
  // no events may still move the cursor.
  bytes next_cursor = 2;
}
