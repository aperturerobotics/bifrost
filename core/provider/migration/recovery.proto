syntax = "proto3";
package provider.migration;

import "github.com/s4wave/spacewave/core/pairing/pairing.proto";
import "github.com/s4wave/spacewave/core/provider/provider.proto";

// AccountMigrationService recovers approved account attachments over authenticated links.
service AccountMigrationService {
  // EnrollMigratedSession binds independent destination storage for an approved Session.
  rpc EnrollMigratedSession(MigratedSessionRequest) returns (MigratedSessionResponse);
  // DeliverAccountTransition proves a redirect from the recipient's held configuration.
  rpc DeliverAccountTransition(.pairing.SharedObject) returns (AccountTransitionReceipt);
}

// AccountTransitionReceipt acknowledges a verified source-account redirect.
message AccountTransitionReceipt {}

// MigratedSessionRequest proves independent Session and destination storage keys.
message MigratedSessionRequest {
  // Transition must match the destination's durable authorization.
  .provider.AccountTransition transition = 1;
  // Identity proves possession of the caller's Session and local storage keys.
  .pairing.Identity identity = 2;
}

// MigratedSessionResponse carries verified checkpoints for the enrolled keys.
message MigratedSessionResponse {
  // Objects includes canonical settings and every current account object.
  repeated .pairing.SharedObject objects = 1;
}
